# Environment for AWS (infra/, option B: ECS on Fargate Spot), read by config/render_groups.py:
#   python3 config/render_groups.py config/aws/env.toml <out>     (docker/build-aws.sh does this)
# Values written @@NAME@@ are filled in at container start by docker/entrypoint.sh from what ECS
# injects (infra/lib/app-stack.ts): JBI_DB_URL, JBI_DB_USER, JBI_DB_PASSWORD (Secrets Manager),
# JBI_OPENSEARCH_URL. Nothing secret is rendered or baked into the image.
[paths]
specs = "/etc/jbi/specs"                 # inside the container
tenants = "/etc/jbi/tenants"
template = "/etc/jbi/jobs-template.json"
specs_src = "../specs"                   # on the build machine, relative to this file
tenants_src = "../../local/live/tenants" # the same tenant lists as the local live stack

[opensearch]
hosts = ["@@JBI_OPENSEARCH_URL@@"]
index = "jobs-v1"
# One t3.small node answered the first full crawl with HTTP 429 (Nov 17): 8 pipelines x 2 workers
# x 3 tasks of scripted bulk upserts. Smaller bulks and patient retries (exponential backoff)
# instead of dropped documents.
bulk_size = 1                            # MiB per bulk request (local: 5)
max_retries = 16                         # local: 5
[opensearch.extra]
aws = { region = "us-east-1" }           # SigV4 with the task role (default credential chain)

[board_state]
url = "@@JBI_DB_URL@@"
username = "@@JBI_DB_USER@@"
password = "@@JBI_DB_PASSWORD@@"

[crawl]
pipeline_workers = 1                     # sink workers per pipeline: 8 concurrent writers per crawler task at most
leader_interval = "PT1M"
request_timeout = "PT30S"

[replicas]                               # must match crawlerTasks / crawlerHeavyTasks in infra/cdk.json
crawler = 2
crawler-heavy = 1

[closure]
opensearch_url = "@@JBI_OPENSEARCH_URL@@"
index = "jobs-v1"
aws_region = "us-east-1"
snapshots = 3                            # three complete snapshots without a job before it closes
mass_closure_ratio = 0.3
mass_closure_min_jobs = 10
retire_after = 3
