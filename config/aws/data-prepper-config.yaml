# Data Prepper server config for AWS; @@NAME@@ values are filled in by docker/entrypoint.sh.
ssl: false
serverPort: 4900
source_coordination:
  partition_prefix: "jbi-aws-"
  store:
    jdbc:
      url: "@@JBI_DB_URL@@"
      username: "@@JBI_DB_USER@@"
      password: "@@JBI_DB_PASSWORD@@"
      ttl: "P2D"
      # One pool per pipeline. db.t4g.micro allows about 80 connections: at 5 the 13 pipeline
      # instances (5 x 2 crawler tasks + 3 heavy) took 65, with board_state (2 per task) and the web
      # app reaching the limit on Nov 17. 3 gives 39 in all. 2 starved under a full re-crawl locally
      # (docs/pipeline-groups-2026-11-13.md). A larger class is refused on the free account plan.
      max_pool_size: 3
      # The table comes from db/V1__source_coordination.sql (the jbi-tools migration task).
      skip_table_creation: true
