# Data Prepper server config for AWS; @@NAME@@ values are filled in by docker/entrypoint.sh.
ssl: false
serverPort: 4900
source_coordination:
  partition_prefix: "jbi-aws-"
  store:
    jdbc:
      url: "@@JBI_DB_URL@@"
      username: "@@JBI_DB_USER@@"
      password: "@@JBI_DB_PASSWORD@@"
      ttl: "P2D"
      # One pool per pipeline, and since Nov 19 each task runs one pipeline (all its groups), so
      # this pool serves every crawl worker in the task (14 in crawler, 11 in crawler-heavy) plus the
      # leader and acknowledgement threads. At 3 (sized when a task ran 5 pipelines) the workers
      # queued for connections and timed out ("Connection is not available ... waiting=10"), and
      # queued retries sat unclaimed for hours (Nov 22). 12 x 3 tasks = 36, plus board_state (2 per
      # task) and the web app: about 45 of the roughly 73 db.t4g.micro allows (45 ran fine Nov 19).
      # Deploys still scale the crawlers to 0 first (infra/README.md).
      max_pool_size: 12
      # The table comes from db/V1__source_coordination.sql (the jbi-tools migration task).
      skip_table_creation: true
