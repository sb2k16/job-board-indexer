# Pipeline groups: which platforms run together, how often, and in which Deployment.
#
# Each Deployment runs ONE Data Prepper pipeline (named after it) whose job_board_crawler source
# holds all of its active groups; each group keeps its own platforms and refresh cadence (its last
# refresh is in Postgres, group_refresh, keyed g<id>-<name>). One pipeline means one OpenSearch sink
# per pod: the domain refuses more than a few bulk requests in flight (Nov 18). The groups of a
# Deployment share its workers (the sum of theirs) and buffer, so a long refresh of one group can
# delay another's boards, though not its refresh time. Work is spread over the Deployment's pods by
# board leases. Render with config/render_groups.py (one pipelines file per Deployment).
#
# A platform is rendered only when config/specs/<platform>.yaml and its tenant list exist, so the
# full Phase 0 assignment can stay here while connectors are built. Moving a platform between
# groups changes only this file; it takes effect on a rolling restart.
# Source: phase0/groups.md (Nov 11) and docs/pipeline-groups-2026-11-13.md.

# Light groups share one Deployment; heavy groups (big tenants, a detail fetch per job, long
# crawls) get their own pods so their memory and threads cannot starve the light ones.
[deployments.crawler]
replicas = 3
[deployments.crawler-heavy]
replicas = 2

[[group]]
id = 1
name = "ats-json"
description = "Hosted ATS, documented JSON: one list call per tenant"
deployment = "crawler"
refresh = "PT2H"
workers = 4
platforms = ["greenhouse", "lever", "ashby", "workable", "recruitee", "pinpoint", "gem", "hirehive", "breezy"]

[[group]]
id = 2
name = "enterprise-json"
description = "Enterprise suites, internal JSON: offset paging, a detail call per job, 2,000+ jobs per tenant"
deployment = "crawler-heavy"
refresh = "PT6H"
workers = 4
platforms = ["workday", "oracle", "eightfold", "adp"]

[[group]]
id = 3
name = "ats-feeds"
description = "ATS feeds: XML or RSS, one request per tenant (Taleo Business Edition included: its RSS feed lists every requisition)"
deployment = "crawler"
refresh = "PT3H"
workers = 2
platforms = ["paylocity", "personio", "teamtailor", "hirebridge", "taleo"]

[[group]]
id = 4
name = "ats-embedded"
description = "ATS with job data embedded in the HTML page (Zoho: escaped JSON in an input; WeRecruit: window.allOffers); detail fetch for descriptions; large tenants"
deployment = "crawler-heavy"
refresh = "PT6H"
workers = 3
platforms = ["comeet", "phenom", "rippling", "zohorecruit", "werecruit"]

[[group]]
id = 5
name = "jsonld-sitemap"
description = "JSON-LD or fixed-template ATS listed by sitemap or search page: every job is a detail fetch (Hireology: 50,000 URLs per file; SuccessFactors: one vendor template)"
deployment = "crawler-heavy"
refresh = "PT12H"
workers = 4
platforms = ["applicantpro", "isolvedhire", "hireology", "icims", "successfactors"]

[[group]]
id = 6
name = "jsonld-pages"
description = "ATS listed by HTML page or feed, one detail fetch per job (JSON-LD, SmartRecruiters' JSON job call, TriNet and Avature templates); PageUp list-only at one request per 150 s"
deployment = "crawler"
refresh = "PT12H"
workers = 4
platforms = ["careerplug", "hiringthing", "jazzhr", "jobvite", "freshteam", "gohire", "join", "kula", "manatal",
             "recooty", "trakstar", "deel", "firststage", "smartrecruiters", "trinet", "avature", "pageup"]

[[group]]
id = 7
name = "boards-feeds"
description = "Job boards with feeds: RSS or embedded JSON; Madgex pages by 20; Jobiqo has a 10 s crawl delay"
deployment = "crawler"
refresh = "PT4H"
workers = 2
platforms = ["wpjobmanager", "jobboardly", "jobboardio", "madgex", "jobiqo"]

[[group]]
id = 8
name = "boards-jsonld"
description = "Job boards with JSON-LD: HTML list or RSS plus detail fetch; multi-employer. JobBoard.com is not run: its one customer board lists ~340,000 URLs, each a detail fetch"
deployment = "crawler"
refresh = "PT12H"
workers = 2
platforms = ["jboard", "smartjobboard", "jobboardhq", "jobkit"]

# Group 9 (html-parser) is gone: the Nov 11 resolution (phase0/html-tier-resolution.md) found
# structured data or one fixed vendor template on all seven, and they now run in groups 4, 5 and 6.

[[group]]
id = 10
name = "session-tier"
description = "Needs browser session state, an internal host or a token; nothing runs here under the current rules"
deployment = "crawler-heavy"
active = false
refresh = "PT12H"
workers = 2
platforms = ["dayforce", "hibob", "brassring", "paradox", "polymer", "jobboardfire", "talentreef"]
