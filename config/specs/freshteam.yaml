# Freshteam career sites: {tenant}.freshteam.com/jobs lists every job; each job page carries a
# JobPosting. robots.txt Allow: /jobs (2026-11-14).
name: freshteam
access_class: A
format: html
list:
  url: "https://{board}.freshteam.com/jobs"
  items: 'href="((?:https://[^"/]+)?/jobs/[A-Za-z0-9_-]+/[^"#?]+)"'
  marker: ['freshteam']
pagination:
  style: none
fields:
  url: url
detail:
  url: "{url}"
  format: jsonld
