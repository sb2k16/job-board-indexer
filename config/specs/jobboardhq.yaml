# jobBoardHQ job boards: {tenant}.jobboardhq.com/search lists jobs ("only the top 500"); each job
# page carries a JobPosting; multi-employer. robots.txt: no rule (2026-11-14).
name: jobboardhq
access_class: A
format: html
list:
  url: "https://{board}.jobboardhq.com/search"
  items: 'href="((?:https://[^"/]+)?/job/[a-z0-9]+/[^"?#]*)"'
  marker: ['jobboardhq']
pagination:
  style: none
  # /search shows 20 jobs. Its other pages are ASP.NET postbacks that send back the page's
  # __VIEWSTATE and __EVENTVALIDATION (embedded page state, which the crawl rules do not replay), and
  # /sitemap.xml and /jobs.rss answer with the home page (Nov 22). A board showing 20 is PARTIAL.
  max_results: 20
fields:
  url: url
detail:
  url: "{url}"
  format: jsonld
