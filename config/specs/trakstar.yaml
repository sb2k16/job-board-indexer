# Trakstar Hire career sites: {tenant}.hire.trakstar.com/jobs lists every job; each job page
# carries a JobPosting. robots.txt Allow: / (2026-11-14).
name: trakstar
access_class: A
format: html
list:
  url: "https://{board}.hire.trakstar.com/jobs"
  items: 'href="((?:https://[^"/]+)?/jobs/[a-z0-9]{6,}/?)"'
  marker: ['(?i)trakstar']
pagination:
  style: none
fields:
  url: url
detail:
  url: "{url}"
  format: jsonld
