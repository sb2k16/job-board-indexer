# ApplicantPro: each tenant's job sitemap {tenant}.applicantpro.com/job_site_map.xml lists every
# job; each job page carries a JobPosting. robots.txt: no rule for the sitemap (2026-11-14).
name: applicantpro
access_class: A
format: html
list:
  url: "https://{board}.applicantpro.com/job_site_map.xml"
  items: '<loc>\s*([^<\s]+/jobs/\d+)\s*</loc>'
  marker: ['<urlset']
pagination:
  style: none
fields:
  url: url
detail:
  url: "{url}"
  format: jsonld
