# Recooty job pages: jobs.recooty.com/{tenant} lists every job; each job page carries a
# JobPosting. robots.txt: no rule (2026-11-14).
name: recooty
access_class: A
format: html
list:
  url: "https://jobs.recooty.com/{board}"
  items: 'href="(https://jobs\.recooty\.com/{board}/[^"?#/]+-[a-z]{2}\d+)"'
  marker: ['recooty']
pagination:
  style: none
fields:
  url: url
detail:
  url: "{url}"
  format: jsonld
