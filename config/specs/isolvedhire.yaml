# iSolvedHire: same platform and markup as ApplicantPro; {tenant}.isolvedhire.com/job_site_map.xml
# lists every job; each job page carries a JobPosting. robots.txt: no rule (2026-11-14).
name: isolvedhire
access_class: A
format: html
list:
  url: "https://{board}.isolvedhire.com/job_site_map.xml"
  items: '<loc>\s*([^<\s]+/jobs/\d+\.html)\s*</loc>'
  marker: ['<urlset']
pagination:
  style: none
fields:
  url: url
detail:
  url: "{url}"
  format: jsonld
