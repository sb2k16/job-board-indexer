# Niceboard job boards ({slug}.niceboard.co or a custom domain); multi-employer. The board's own
# job list calls GET /api/jobs with its default filters (company=all, empty arrays as JSON, newest
# first), 30 a page, with the open-job count in "count". robots.txt (2026-11-22): Allow /, Disallow
# /api/ but Allow /api/jobs$ and /api/jobs?, Crawl-delay 1. The /sitemap-jobs.xml is not a list of
# open jobs: 206 of its 209 URLs answered 404 on Nov 22. Until Nov 22 robots.txt disallowed all of
# /api/, so Phase 0 graded it blocked (docs/unsupported-platforms-research-2026-11-22.md).
name: niceboard
access_class: A
format: json
list:
  url: "https://{board}/api/jobs?company=all&jobtype=%5B%5D&category=%5B%5D&secondary_category=%5B%5D&tags=%5B%5D&city=%5B%5D&state=%5B%5D&country=%5B%5D&remote_ok=false&remote_only=false&salary_timeframe=&salary_min=&salary_max=&keyword=&custom_fields=%7B%7D&limit=30&sortby=newest"
  items: jobs
  marker: [count]
  total: count
pagination:
  style: page
  param: page
  start: 1
  page_size: 30
fields:
  platform_job_id: id
  title: title
  company: company_name
  location: location_name
  employment_type: jobtype.name
  remote: { path: is_remote, type: boolean }
  posted_at: { path: published_at, type: datetime }
  description: { path: description_html, transform: [html_to_text] }
  url: { template: "https://{board}/job/{id}-{slug}-{company_slug}" }
  application_url: apply_url
# Crawl-delay 1 in robots.txt: one request every 2 s across the pods (a board is a few pages).
rate_limit:
  requests_per_second: 0.5
  max_concurrency: 1
