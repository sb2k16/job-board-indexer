# Teamtailor: {tenant}.teamtailor.com/jobs.rss, every published job with its description. Phase 0
# found the feed on some tenants only (404 on others: a per-tenant setting, read as GONE).
# robots.txt: none on tenant hosts (2026-11-14).
name: teamtailor
access_class: A
format: xml
namespaces:
  tt: https://teamtailor.com/locations
list:
  url: "https://{board}.teamtailor.com/jobs.rss"
  items: /rss/channel/item
  marker: [/rss/channel]
pagination:
  style: none
fields:
  platform_job_id: { path: link, regex: "/jobs/(\\d+)" }
  title: title
  company: /rss/channel/title
  location: { concat: [tt:locations/tt:location/tt:city, tt:locations/tt:location/tt:country], join: ", " }
  city: tt:locations/tt:location/tt:city
  country: tt:locations/tt:location/tt:country
  remote: { path: remoteStatus, type: boolean, true_values: [fully, remote, temporary] }
  description: { path: description, transform: [html_unescape, html_to_text] }
  posted_at: { path: pubDate, type: datetime, format: rfc1123 }
  url: link
