# Kula career sites: careers.kula.ai/{tenant} lists every job; each job page carries a JobPosting.
# robots.txt Allow: / (2026-11-14).
name: kula
access_class: A
format: html
list:
  url: "https://careers.kula.ai/{board}"
  items: 'href="((?:https://careers\.kula\.ai)?/{board}/\d+-?[^"?#]*)"'
  marker: ['kula']
pagination:
  style: none
fields:
  url: url
detail:
  url: "{url}"
  format: jsonld
