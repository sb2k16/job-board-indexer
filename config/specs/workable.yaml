# Workable: the public widget API lists every published job of an account, and with details=true
# each job carries its full description (description, requirements and benefits as one HTML body):
# one request per board. robots.txt on apply.workable.com disallows nothing (2026-11-22).
# Until Nov 22 descriptions came from the per-job v2 endpoint (/api/v2/accounts/{board}/jobs/{code}).
# From AWS, Cloudflare answered that endpoint 429 on the first call of every crawl, even at one
# request a minute, while the laptop got 200: it refused per-job calls from our addresses, which no
# slower rate could fix. The list call was never refused.
name: workable
access_class: A
format: json
list:
  url: "https://apply.workable.com/api/v1/widget/accounts/{board}?details=true"
  items: jobs
  marker: [jobs, name]
pagination:
  style: none
fields:
  platform_job_id: shortcode
  title: title
  location: { concat: [city, state, country], join: ", " }
  city: city
  region: state
  country: country
  employment_type: employment_type
  remote: { path: telecommuting, type: boolean }
  requisition_id: code
  posted_at: { path: published_on, type: datetime }
  url: url
  application_url: application_url
  description: { path: description, transform: [html_to_text] }
rate_limit:
  requests_per_second: 1
  max_concurrency: 1
