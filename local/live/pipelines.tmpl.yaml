# Live crawl: real ATS and job-board platforms, no fixture server. See docker-compose.live.yml.
version: "2"
job-crawl:
  workers: 2
  delay: 100
  source:
    job_board_crawler:
      refresh_interval: "PT30M"     # live boards: re-crawl every 30 minutes
      leader_interval: "PT10S"
      workers: 2
      acknowledgments: true
      politeness:
        replicas: 2                 # docker-compose.live.yml runs 2 crawler instances
        request_timeout: "PT30S"
      board_state:
        url: "jdbc:postgresql://postgres:5432/jbi"
        username: jbi
        password: jbi
      platforms:
        - name: greenhouse                       # ATS
          spec: /etc/jbi/specs/greenhouse.yaml
          tenants_file: /etc/jbi/tenants/greenhouse.csv
        - name: lever                       # ATS
          spec: /etc/jbi/specs/lever.yaml
          tenants_file: /etc/jbi/tenants/lever.csv
        - name: ashby                       # ATS
          spec: /etc/jbi/specs/ashby.yaml
          tenants_file: /etc/jbi/tenants/ashby.csv
        - name: recruitee                       # ATS
          spec: /etc/jbi/specs/recruitee.yaml
          tenants_file: /etc/jbi/tenants/recruitee.csv
        - name: pinpoint                       # ATS
          spec: /etc/jbi/specs/pinpoint.yaml
          tenants_file: /etc/jbi/tenants/pinpoint.csv
        - name: gem                       # ATS
          spec: /etc/jbi/specs/gem.yaml
          tenants_file: /etc/jbi/tenants/gem.csv
        - name: hirebridge                       # ATS
          spec: /etc/jbi/specs/hirebridge.yaml
          tenants_file: /etc/jbi/tenants/hirebridge.csv
        - name: wpjobmanager                       # job board
          spec: /etc/jbi/specs/wpjobmanager.yaml
          tenants_file: /etc/jbi/tenants/wpjobmanager.csv
        - name: madgex                       # job board
          spec: /etc/jbi/specs/madgex.yaml
          tenants_file: /etc/jbi/tenants/madgex.csv
  buffer:
    bounded_blocking:
      buffer_size: 4096
      batch_size: 256
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        insecure: true
        index: "jobs-v1"
        index_type: custom
        template_type: index-template
        template_file: "/etc/jbi/jobs-template.json"
        document_id: "${/job_key}"
        action: "upsert"
        script:
          source: __UPSERT_SCRIPT__
        max_retries: 5
        bulk_size: 5
