# Environment for the local live stack (docker-compose.live.yml), read by config/render_groups.py:
#   python3 ../config/render_groups.py live/env.toml live/pipelines
[paths]
specs = "/etc/jbi/specs"                 # inside the container
tenants = "/etc/jbi/tenants"
template = "/etc/jbi/jobs-template.json"
specs_src = "../../config/specs"         # on this machine, relative to this file: decides which platforms are built
tenants_src = "tenants"

[opensearch]
hosts = ["http://opensearch:9200"]
insecure = true
index = "jobs-v1"

[board_state]
url = "jdbc:postgresql://postgres:5432/jbi"
username = "jbi"
password = "jbi"

[crawl]
refresh_override = "PT30M"               # live boards locally: every 30 minutes, whatever the group's cadence
leader_interval = "PT10S"
request_timeout = "PT30S"

[replicas]                               # local pod counts; must match --scale in docker compose
crawler = 2
crawler-heavy = 1

[closure]                                # the sweeper (T2.5); omit to never close jobs
opensearch_url = "http://opensearch:9200"
index = "jobs-v1"
snapshots = 2                            # production: 3
mass_closure_ratio = 0.3
mass_closure_min_jobs = 10
retire_after = 3

# Local only: one fixture board crawled every minute, so the closure end-to-end test
# (tests/t25_closure_e2e.py) sees jobs disappear and return within minutes. Real boards keep their
# own cadence. The board lives in local/fixture-board/boards/closure-demo.json.
[[extra_group]]
id = 99
name = "local-fixture"
description = "Local fixture board for the closure end-to-end test"
deployment = "crawler"
refresh = "PT1M"
workers = 1
[[extra_group.platform]]
name = "fixture"
spec = "greenhouse"
base_url = "http://fixture:8080"
