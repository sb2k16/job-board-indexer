version: "2"
job-crawl:
  workers: 2
  delay: 100
  source:
    job_board_crawler:
      refresh_interval: "PT3M"
      leader_interval: "PT10S"
      workers: 2
      acknowledgments: true
      politeness:
        replicas: 3                 # compose runs 3 crawler replicas; each takes a third of every budget
        request_timeout: "PT5S"     # synth boards answer after 3 s, fault-timeout after 8 s
        max_attempts: 3
        backoff_base: "PT0.2S"
        backoff_cap: "PT1S"
      board_state:
        url: "jdbc:postgresql://postgres:5432/jbi"
        username: jbi
        password: jbi
      platforms:
        - name: greenhouse
          spec: /etc/jbi/specs/greenhouse.yaml
          base_url: "http://fixture:8080"
          tenants_file: /etc/jbi/tenants/greenhouse.csv
        - name: lever
          spec: /etc/jbi/specs/lever.yaml
          base_url: "http://fixture:8080"
          tenants_file: /etc/jbi/tenants/lever.csv
        - name: hirebridge
          spec: /etc/jbi/specs/hirebridge.yaml
          base_url: "http://fixture:8080"
          tenants_file: /etc/jbi/tenants/hirebridge.csv
  buffer:
    bounded_blocking:
      buffer_size: 4096
      batch_size: 256
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        insecure: true
        index: "jobs-v1"
        index_type: custom
        template_type: index-template
        template_file: "/etc/jbi/jobs-template.json"
        document_id: "${/job_key}"
        action: "upsert"
        script:
          source: __UPSERT_SCRIPT__
        max_retries: 5
        bulk_size: 5
