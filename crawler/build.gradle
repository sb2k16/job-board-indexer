/*
 * Job Board Indexer crawler: a Data Prepper source plugin built outside the Data Prepper repo.
 * Data Prepper jars are compileOnly: the runtime image provides them, so the plugin jar holds only our classes.
 */
plugins {
    id 'java'
}

group = 'io.github.sb2k16'
version = '0.1.0'

base {
    archivesName = 'job-board-crawler'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(11) }
}

repositories {
    mavenCentral()
}

def dp = project.property('dataPrepperVersion')

dependencies {
    compileOnly "org.opensearch.dataprepper:data-prepper-api:${dp}"
    compileOnly "org.opensearch.dataprepper.plugins.source.source_crawler:source-crawler:${dp}"
    // Provided by Data Prepper at runtime; versions match what data-prepper-api brings in.
    compileOnly 'io.micrometer:micrometer-core:1.13.0'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    compileOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    compileOnly 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'
    compileOnly 'org.slf4j:slf4j-api:2.0.13'
    compileOnly 'javax.inject:javax.inject:1'
    compileOnly 'jakarta.validation:jakarta.validation-api:3.1.1'
    compileOnly 'org.springframework:spring-context:5.3.39'
    compileOnly 'com.zaxxer:HikariCP:5.1.0'
    // AWS SDK 2.53.0 as shipped in Data Prepper 2.17.0's lib/: SigV4 for the closure sweeper.
    compileOnly 'software.amazon.awssdk:auth:2.53.0'
    compileOnly 'software.amazon.awssdk:http-auth-aws:2.53.0'
    compileOnly 'software.amazon.awssdk:http-client-spi:2.53.0'

    testImplementation "org.opensearch.dataprepper:data-prepper-api:${dp}"
    testImplementation "org.opensearch.dataprepper.plugins.source.source_crawler:source-crawler:${dp}"
    testImplementation "org.opensearch.dataprepper.test:test-common:${dp}"
    testImplementation 'io.micrometer:micrometer-core:1.13.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'
    testImplementation 'org.slf4j:slf4j-api:2.0.13'
    testImplementation 'software.amazon.awssdk:auth:2.53.0'
    testImplementation 'software.amazon.awssdk:http-auth-aws:2.53.0'
    testImplementation 'software.amazon.awssdk:http-client-spi:2.53.0'
    testImplementation 'javax.inject:javax.inject:1'
    testImplementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    testImplementation 'org.springframework:spring-context:5.3.39'
    testImplementation 'com.zaxxer:HikariCP:5.1.0'
    testImplementation 'org.postgresql:postgresql:42.7.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation 'org.hamcrest:hamcrest:2.2'
}

test {
    useJUnitPlatform()
    // Tests run the specs that ship, not copies of them.
    systemProperty 'jbi.specs.dir', System.getProperty('jbi.specs.dir', rootProject.file('config/specs').absolutePath)
    inputs.dir rootProject.file('config/specs')
    // JdbcBoardStateStoreIT runs only when a database is given: -Djbi.test.jdbc.url=jdbc:postgresql://localhost:55432/jbi
    systemProperty 'jbi.test.jdbc.url', System.getProperty('jbi.test.jdbc.url', '')
    systemProperty 'jbi.db.dir', rootProject.file('db').absolutePath
    // LiveSpecRun runs only when targets are given: -Djbi.live=workable:tiger-analytics (tests/live_spec.sh)
    systemProperty 'jbi.live', System.getProperty('jbi.live', '')
    // RecordFixtures runs only when platforms are given (tests/record_fixtures.sh)
    systemProperty 'jbi.record', System.getProperty('jbi.record', '')
    systemProperty 'jbi.tenants.dir', rootProject.file('local/live/tenants').absolutePath
}
